name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build installable app
        env:
          APP_VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_id }}
        run: sh scripts/build-installable-app.sh

      - name: Upload installable app
        uses: actions/upload-artifact@v7
        with:
          name: bl00p-${{ github.sha }}
          path: .build/install/bl00p-0.0.0-macos-arm64.zip
          if-no-files-found: error
