name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package-macos:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify portable UI contracts
        run: sh scripts/check-portable-ui.sh

      # A stalled fetch of a package dependency (e.g. the Sparkle binary
      # artifact) on a cold `.build` looks identical to a hung compile: no
      # output, no CPU, no timeout. Restoring SwiftPM's caches removes the
      # network fetch on a cache hit; the step timeouts below are the
      # actual backstop against a genuine stall.
      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install OpenSSL 3
        run: |
          brew install openssl@3
          echo "OPENSSL_BIN=$(brew --prefix openssl@3)/bin/openssl" \
              >> "$GITHUB_ENV"

      - name: Verify OpenSSL Ed25519 support
        run: sh scripts/check-openssl-ed25519.sh

      - name: Verify automatic release configuration
        run: sh scripts/check-release-config.sh

      - name: Run tests
        timeout-minutes: 12
        run: swift test --disable-sandbox

      - name: Build installable app
        timeout-minutes: 12
        env:
          APP_VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_id }}
          CODE_SIGN_IDENTITY: "-"
        run: sh scripts/build-installable-app.sh

      - name: Upload installable app
        uses: actions/upload-artifact@v7
        with:
          name: bl00p-macos-${{ github.sha }}
          path: .build/install/bl00p-0.0.0-macos-arm64.zip
          if-no-files-found: error

  test-and-package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify portable UI contracts
        run: sh scripts/check-portable-ui.sh

      - name: Verify automatic release configuration
        run: sh scripts/check-release-config.sh

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install GTK4 development headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run tests
        timeout-minutes: 12
        run: swift test

      - name: Build installable .deb
        timeout-minutes: 12
        env:
          APP_VERSION: 0.0.0
        run: sh scripts/build-installable-deb.sh

      - name: Upload installable .deb
        uses: actions/upload-artifact@v7
        with:
          name: bl00p-linux-${{ github.sha }}
          path: .build/deb/bl00p_0.0.0_amd64.deb
          if-no-files-found: error
