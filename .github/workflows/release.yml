name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic version tag to release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-release-ref:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a reviewed main commit
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          git fetch --force --no-tags \
              origin refs/heads/main:refs/remotes/origin/main

          workflow_sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          if ! git merge-base --is-ancestor "$workflow_sha" origin/main; then
            echo "Workflow commit $workflow_sha is not contained in origin/main" >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
            tag=$GITHUB_REF_NAME
            release_sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must be dispatched from main" >&2
              exit 1
            fi

            version=$DISPATCH_VERSION
            tag=v$version
            git fetch --force origin \
                "refs/tags/$tag:refs/tags/$tag"
            release_sha=$(git rev-parse "$tag^{commit}")
          fi

          if ! printf '%s' "$version" |
              grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match version $version" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release commit $release_sha is not contained in origin/main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  release:
    needs: verify-release-ref
    runs-on: macos-15
    environment:
      name: release
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.verify-release-ref.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-release-ref.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify-release-ref.outputs.sha }}

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify account-free release configuration
        run: sh scripts/check-release-config.sh

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build ad-hoc-signed app
        env:
          BUILD_NUMBER: ${{ github.run_id }}
          CODE_SIGN_IDENTITY: "-"
        run: sh scripts/build-installable-app.sh

      - name: Verify archived ad-hoc signatures
        run: |
          sh scripts/verify-adhoc-signatures.sh \
              ".build/install/bl00p-$APP_VERSION-macos-arm64.zip"

      - name: Generate and verify signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          archive="bl00p-$APP_VERSION-macos-arm64.zip"
          update_dir="$RUNNER_TEMP/bl00p-update"
          mkdir -p "$update_dir"
          cp ".build/install/$archive" "$update_dir/$archive"
          printf 'See the GitHub release for changes in bl00p %s.\n' \
              "$APP_VERSION" > "$update_dir/bl00p-$APP_VERSION-macos-arm64.md"

          printf '%s' "$SPARKLE_PRIVATE_KEY" |
              .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
                  --ed-key-file - \
                  --download-url-prefix \
                  "https://github.com/suttree/bl00p/releases/download/$RELEASE_TAG/" \
                  --link "https://github.com/suttree/bl00p" \
                  --maximum-deltas 0 \
                  --embed-release-notes \
                  -o "$RUNNER_TEMP/appcast.xml" \
                  "$update_dir"

          sh scripts/verify-update-signature.sh \
              "$RUNNER_TEMP/appcast.xml" \
              ".build/install/$archive"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
              ".build/install/bl00p-$APP_VERSION-macos-arm64.zip" \
              "$RUNNER_TEMP/appcast.xml" \
              --target "$RELEASE_SHA" \
              --title "bl00p $APP_VERSION" \
              --generate-notes
